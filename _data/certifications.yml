# Certification groups. `icon` is a badge image in assets/img/badges/ (falls back to `abbr` as a text badge);
# `year` is optional.
groups:
  - group: GIAC (SANS)
    items:
      - { abbr: GCFA, icon: gcfa.png, name: GIAC Certified Forensic Analyst, year: 2026 }
      - { abbr: GNFA, icon: gnfa.png, name: GIAC Network Forensic Analyst, year: 2026 }
      - { abbr: GCIH, icon: gcih.png, name: GIAC Certified Incident Handler, year: 2025 }
      - { abbr: GCCC, icon: gccc.png, name: GIAC Critical Controls Certification, year: 2025 }
