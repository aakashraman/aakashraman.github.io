- title: GoPhish Auto-Deploy
  featured: true
  repo: https://github.com/aakashraman/GoPhish-Deployment
  summary: >-
    One-shot deployment of GoPhish on a DigitalOcean droplet with a Namecheap domain, including
    Let's Encrypt certificates via DNS challenge and optional Namecheap API DNS automation.
  points:
    - Installs dependencies and pulls the latest GoPhish release
    - Configures admin access and TLS certificate paths
    - Issues certificates with Certbot using a DNS-01 challenge
    - Optionally creates Namecheap TXT records automatically
  tags: [Python, Certbot, Namecheap API, Phishing Simulation]

- title: SOAR Python Toolkit
  repo: https://github.com/aakashraman/soarsamplepythonscripts
  summary: >-
    Python scripts for common SOAR use cases that speed up SOC triage and incident response.
  points:
