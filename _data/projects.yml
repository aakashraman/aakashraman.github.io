# `featured: true` projects also appear on the home page.
- title: SigmaForage
  featured: true
  repo: https://github.com/aakashraman/SigmaForage
  summary: >-
    "One Sigma rule. Every SIEM." A CLI that converts Sigma detection rules into native queries for
    18+ SIEM and XDR platforms (Splunk SPL, Elastic, Sentinel KQL, QRadar AQL, CrowdStrike and more)
    using the official sigma-cli / pySigma backends.
  points:
    - Convert one rule to several SIEMs in a single command
    - Accepts a rule path or stdin and outputs ready-to-paste queries
    - Ships 60+ SigmaHQ threat-hunting rules for testing and demos
  tags: [Python, Sigma, pySigma, Detection Engineering]

