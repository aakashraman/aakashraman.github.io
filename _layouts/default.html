<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}" data-theme="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0f17">
    <script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
{% seo %}
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5.0.16/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.18/500.css">
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to content</a>

    <header class="nav">
      <div class="container nav-inner">
        <a class="brand" href="{{ "/" | relative_url }}" aria-label="Home">
          <span class="brand-mark" aria-hidden="true">AR</span>
          <span>{{ site.title }}</span>
        </a>
        <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation">
        <label for="nav-toggle" class="nav-burger" aria-hidden="true"><span></span></label>
        <nav class="nav-links" aria-label="Primary">
          {%- for item in site.nav %}
          <a href="{{ item.link | relative_url }}"{% if page.url == item.link %} aria-current="page"{% endif %}>{{ item.name }}</a>
          {%- endfor %}
          <a class="btn btn-sm btn-primary" href="{{ site.resume | relative_url }}" target="_blank" rel="noopener">Résumé</a>
        </nav>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to light theme"><i class="fa-solid fa-sun" aria-hidden="true"></i><i class="fa-solid fa-moon" aria-hidden="true"></i></button>
      </div>
    </header>

    <main id="main">
      {{ content }}
    </main>

    <footer class="footer">
      <div class="container footer-inner">
        <p>© {{ site.time | date: "%Y" }} {{ site.title }} · Baltimore, MD</p>
        <div class="socials">{% include socials.html %}</div>
      </div>
    </footer>
    <script src="{{ "/assets/js/site.js" | relative_url }}" defer></script>
  </body>
</html>
